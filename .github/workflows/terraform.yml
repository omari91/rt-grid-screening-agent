name: Deploy AWS Audit Lakehouse

on:
  push:
    branches: [ "main" ]
    paths:
      - "deploy/aws/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "deploy/aws/**"
      - ".github/workflows/terraform.yml"

permissions:
  id-token: write   # Required for keyless AWS OIDC authentication
  contents: read    # Required to checkout repository code

jobs:
  terraform:
    name: Terraform Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./deploy/aws

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TERRAFORM_ROLE_ARN || 'arn:aws:iam::123456789012:role/GitHubActions-TerraformDeployRole' }}
          aws-region: eu-central-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        id: fmt
        run: terraform fmt -check

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Plan
        id: plan
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      - name: Terraform Apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false

